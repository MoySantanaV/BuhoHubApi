name: Notificaciones programadas

# Vercel Hobby solo permite un cron al día, así que GitHub Actions despierta al servidor cada 5 minutos.
# Los envíos son idempotentes (NotificationLog), por lo que una corrida repetida o tardía no duplica avisos.
on:
    schedule:
        - cron: '*/5 * * * *'
    workflow_dispatch:

jobs:
    run:
        runs-on: ubuntu-latest
        steps:
            - name: Llamar al servidor
              env:
                  API_URL: ${{ secrets.NOTIFICATIONS_API_URL }}
                  CRON_SECRET: ${{ secrets.CRON_SECRET }}
              run: |
                  curl --fail-with-body --silent --show-error --max-time 50 \
                    -X POST "$API_URL/v1/internal/notifications/run" \
                    -H "Authorization: Bearer $CRON_SECRET"
